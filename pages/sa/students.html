<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理 - SA学生作业记录管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">SA学生作业记录管理系统</a>
            <button class="navbar-toggler" type="button" onclick="toggleMobileMenu()">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2"></i><span id="username">SA老师</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">个人信息</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="javascript:logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span class="nav-text">控制台</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="students.html">
                    <i class="bi bi-person-lines-fill"></i>
                    <span class="nav-text">学生管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="homework.html">
                    <i class="bi bi-book"></i>
                    <span class="nav-text">作业管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="statistics.html">
                    <i class="bi bi-bar-chart"></i>
                    <span class="nav-text">统计分析</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="export.html">
                    <i class="bi bi-download"></i>
                    <span class="nav-text">数据导出</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="h3">学生管理</h1>
                    <p class="text-muted">管理您名下的学生</p>
                </div>
            </div>

            <!-- 搜索和筛选 -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="搜索学生姓名" id="searchInput">
                        <button class="btn btn-primary" onclick="searchStudents()">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <!-- SA老师只能查看学生，不能添加学生 -->
                    <div class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle"></i> 学生添加和分配由管理员操作
                    </div>
                </div>
            </div>

            <!-- 学生列表 -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">学生列表</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>学生ID</th>
                                            <th>学生姓名</th>
                                            <th>级别</th>
                                            <th>班级</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="studentTableBody">
                                        <!-- 学生数据将通过JavaScript动态填充 -->
                                    </tbody>
                                </table>
                            </div>
                            <!-- 分页 -->
                            <div class="mt-4 d-flex justify-content-center" id="pagination"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 学生详情模态框 -->
    <div class="modal fade" id="studentDetailModal" tabindex="-1" aria-labelledby="studentDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="studentDetailModalLabel">学生详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">学生姓名</label>
                        <input type="text" class="form-control" id="detailName" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">级别</label>
                        <input type="text" class="form-control" id="detailLevel" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">班级</label>
                        <input type="text" class="form-control" id="detailClass" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SA老师</label>
                        <input type="text" class="form-control" id="detailSaName" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">创建时间</label>
                        <input type="text" class="form-control" id="detailCreatedAt" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script>
        // 初始化页面
        if (!initPage()) {
            // 未登录，已跳转到登录页面
            return;
        }

        let students = [];
        let filteredStudents = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        // 页面加载完成后执行
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                // 加载学生列表
                await loadStudents();
            } catch (error) {
                console.error('加载学生列表失败:', error);
                showToast('加载学生列表失败', 'danger');
            }
        });

        // 加载学生列表
        async function loadStudents() {
            try {
                // 获取SA老师名下的学生
                students = await apiRequest('/students/my-students');
                filteredStudents = students;
                renderStudentTable();
                renderPagination();
            } catch (error) {
                console.error('加载学生列表失败:', error);
                throw error;
            }
        }

        // 搜索学生
        function searchStudents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredStudents = students.filter(student => 
                student.name.toLowerCase().includes(searchTerm)
            );
            currentPage = 1;
            renderStudentTable();
            renderPagination();
        }

        // 渲染学生表格
        function renderStudentTable() {
            const tableBody = document.getElementById('studentTableBody');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageStudents = filteredStudents.slice(startIndex, endIndex);

            tableBody.innerHTML = '';

            if (pageStudents.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center">暂无学生数据</td></tr>';
                return;
            }

            pageStudents.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.level}</td>
                    <td>${student.class_}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="showStudentDetail(${student.id})">
                            <i class="bi bi-eye"></i> 查看
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 渲染分页
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredStudents.length / itemsPerPage);

            pagination.innerHTML = '';

            if (totalPages <= 1) {
                return;
            }

            // 上一页按钮
            const prevButton = document.createElement('button');
            prevButton.className = `btn btn-outline-primary me-2 ${currentPage === 1 ? 'disabled' : ''}`;
            prevButton.textContent = '上一页';
            prevButton.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderStudentTable();
                    renderPagination();
                }
            };
            pagination.appendChild(prevButton);

            // 页码按钮
            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = `btn btn-outline-primary me-2 ${i === currentPage ? 'active' : ''}`;
                pageButton.textContent = i;
                pageButton.onclick = () => {
                    currentPage = i;
                    renderStudentTable();
                    renderPagination();
                };
                pagination.appendChild(pageButton);
            }

            // 下一页按钮
            const nextButton = document.createElement('button');
            nextButton.className = `btn btn-outline-primary ${currentPage === totalPages ? 'disabled' : ''}`;
            nextButton.textContent = '下一页';
            nextButton.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderStudentTable();
                    renderPagination();
                }
            };
            pagination.appendChild(nextButton);
        }

        // 显示学生详情
        async function showStudentDetail(studentId) {
            try {
                const student = await apiRequest(`/students/${studentId}`);
                
                document.getElementById('detailName').value = student.name;
                document.getElementById('detailLevel').value = student.level;
                document.getElementById('detailClass').value = student.class_;
                document.getElementById('detailSaName').value = student.sa_name;
                document.getElementById('detailCreatedAt').value = new Date(student.created_at).toLocaleString();
                
                const modal = new bootstrap.Modal(document.getElementById('studentDetailModal'));
                modal.show();
            } catch (error) {
                console.error('获取学生详情失败:', error);
                showToast('获取学生详情失败', 'danger');
            }
        }
    </script>
</body>
</html>
