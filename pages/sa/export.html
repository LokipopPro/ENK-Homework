<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据导出 - SA学生作业记录管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">SA学生作业记录管理系统</a>
            <button class="navbar-toggler" type="button" onclick="toggleMobileMenu()">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2"></i><span id="username">SA老师</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">个人信息</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="javascript:logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span class="nav-text">控制台</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="students.html">
                    <i class="bi bi-person-lines-fill"></i>
                    <span class="nav-text">学生管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="homework.html">
                    <i class="bi bi-book"></i>
                    <span class="nav-text">作业管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="statistics.html">
                    <i class="bi bi-bar-chart"></i>
                    <span class="nav-text">统计分析</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="export.html">
                    <i class="bi bi-download"></i>
                    <span class="nav-text">数据导出</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="h3">数据导出</h1>
                    <p class="text-muted">导出学生作业记录和统计数据</p>
                </div>
            </div>

            <!-- 导出选项 -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">作业记录导出</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">导出格式</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <a href="javascript:exportRecords('csv')" class="btn btn-block btn-outline-primary mb-2">
                                            <i class="bi bi-file-earmark-text"></i> 导出为CSV
                                        </a>
                                    </div>
                                    <div class="col-md-6">
                                        <a href="javascript:exportRecords('excel')" class="btn btn-block btn-outline-primary mb-2">
                                            <i class="bi bi-file-earmark-excel"></i> 导出为Excel
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">导出范围</label>
                                <select class="form-select" id="exportScope">
                                    <option value="all">所有学生</option>
                                    <option value="single">单个学生</option>
                                </select>
                            </div>
                            <div class="mb-3" id="studentSelectContainer" style="display: none;">
                                <label class="form-label">选择学生</label>
                                <select class="form-select" id="exportStudentSelect">
                                    <option value="">请选择学生</option>
                                    <!-- 选项将通过JavaScript动态填充 -->
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">统计数据导出</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">导出格式</label>
                                <div class="row">
                                    <div class="col-md-12">
                                        <a href="javascript:exportStatistics()" class="btn btn-block btn-outline-primary mb-2">
                                            <i class="bi bi-file-earmark-excel"></i> 导出统计数据为Excel
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <div class="alert alert-info" role="alert">
                                <i class="bi bi-info-circle"></i> 统计数据将包含学生个人统计和班级统计信息
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script>
        // 初始化页面
        if (!initPage()) {
            // 未登录，已跳转到登录页面
            return;
        }

        let students = [];

        // 页面加载完成后执行
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                // 加载学生列表
                await loadStudents();
                
                // 绑定事件
                document.getElementById('exportScope').addEventListener('change', function() {
                    if (this.value === 'single') {
                        document.getElementById('studentSelectContainer').style.display = 'block';
                    } else {
                        document.getElementById('studentSelectContainer').style.display = 'none';
                    }
                });
            } catch (error) {
                console.error('加载数据失败:', error);
                showToast('加载数据失败', 'danger');
            }
        });

        // 加载学生列表
        async function loadStudents() {
            try {
                // 获取SA老师名下的学生
                students = await apiRequest('/students/my-students');
                
                // 填充学生下拉框
                const studentSelect = document.getElementById('exportStudentSelect');
                if (studentSelect) {
                    studentSelect.innerHTML = '<option value="">请选择学生</option>';
                    students.forEach(student => {
                        const option = document.createElement('option');
                        option.value = student.id;
                        option.textContent = student.name;
                        studentSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载学生列表失败:', error);
                throw error;
            }
        }

        // 导出作业记录
        function exportRecords(format) {
            try {
                const scope = document.getElementById('exportScope').value;
                let url = `/export/records/${format}`;
                
                if (scope === 'single') {
                    const studentId = document.getElementById('exportStudentSelect').value;
                    if (!studentId) {
                        showToast('请选择学生', 'warning');
                        return;
                    }
                    url += `?student_id=${studentId}`;
                }
                
                // 发送请求
                const token = localStorage.getItem('token');
                window.location.href = `http://localhost:8000/api${url}?token=${token}`;
            } catch (error) {
                console.error('导出作业记录失败:', error);
                showToast('导出作业记录失败', 'danger');
            }
        }

        // 导出统计数据
        function exportStatistics() {
            try {
                const token = localStorage.getItem('token');
                window.location.href = `http://localhost:8000/api/export/statistics/excel?token=${token}`;
            } catch (error) {
                console.error('导出统计数据失败:', error);
                showToast('导出统计数据失败', 'danger');
            }
        }
    </script>
</body>
</html>
