<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理 - SA学生作业记录管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">SA学生作业记录管理系统</a>
            <button class="navbar-toggler" type="button" onclick="toggleMobileMenu()">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2"></i><span id="username">管理员</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">个人信息</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="javascript:logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span class="nav-text">控制台</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="users.html">
                    <i class="bi bi-people"></i>
                    <span class="nav-text">用户管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="students.html">
                    <i class="bi bi-person-lines-fill"></i>
                    <span class="nav-text">学生管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="homework.html">
                    <i class="bi bi-book"></i>
                    <span class="nav-text">作业管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="statistics.html">
                    <i class="bi bi-bar-chart"></i>
                    <span class="nav-text">统计分析</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="export.html">
                    <i class="bi bi-download"></i>
                    <span class="nav-text">数据导出</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="h3">学生管理</h1>
                    <p class="text-muted">管理学生信息和SA老师绑定</p>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="row mb-4">
                <div class="col-12">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                        <i class="bi bi-plus me-2"></i>添加学生
                    </button>
                </div>
            </div>

            <!-- 搜索和筛选 -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="搜索学生姓名" id="searchInput">
                        <button class="btn btn-outline-primary" onclick="searchStudents()">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group">
                        <select class="form-select" id="saFilter">
                            <option value="">所有SA老师</option>
                            <!-- 选项将通过JavaScript动态填充 -->
                        </select>
                        <button class="btn btn-outline-primary" onclick="filterBySA()">
                            <i class="bi bi-filter"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 学生列表 -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped" id="studentsTable">
                                    <thead>
                                        <tr>
                                            <th onclick="sortTable(this.closest('table'), 0)">ID</th>
                                            <th onclick="sortTable(this.closest('table'), 1)">学生姓名</th>
                                            <th onclick="sortTable(this.closest('table'), 2)">级别</th>
                                            <th onclick="sortTable(this.closest('table'), 3)">班级</th>
                                            <th onclick="sortTable(this.closest('table'), 4)">SA老师</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="studentsBody">
                                        <!-- 数据将通过JavaScript动态填充 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加学生模态框 -->
    <div class="modal fade" id="addStudentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加学生</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addStudentForm">
                        <div class="mb-3">
                            <label for="studentName" class="form-label">学生姓名</label>
                            <input type="text" class="form-control" id="studentName" required>
                        </div>
                        <div class="mb-3">
                            <label for="studentLevel" class="form-label">级别</label>
                            <input type="text" class="form-control" id="studentLevel" required>
                        </div>
                        <div class="mb-3">
                            <label for="studentClass" class="form-label">班级</label>
                            <input type="text" class="form-control" id="studentClass" required>
                        </div>
                        <div class="mb-3">
                            <label for="studentSA" class="form-label">SA老师</label>
                            <select class="form-select" id="studentSA" required>
                                <!-- 选项将通过JavaScript动态填充 -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addStudent()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑学生模态框 -->
    <div class="modal fade" id="editStudentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑学生</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editStudentForm">
                        <input type="hidden" id="editStudentId">
                        <div class="mb-3">
                            <label for="editStudentName" class="form-label">学生姓名</label>
                            <input type="text" class="form-control" id="editStudentName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editStudentLevel" class="form-label">级别</label>
                            <input type="text" class="form-control" id="editStudentLevel" required>
                        </div>
                        <div class="mb-3">
                            <label for="editStudentClass" class="form-label">班级</label>
                            <input type="text" class="form-control" id="editStudentClass" required>
                        </div>
                        <div class="mb-3">
                            <label for="editStudentSA" class="form-label">SA老师</label>
                            <select class="form-select" id="editStudentSA" required>
                                <!-- 选项将通过JavaScript动态填充 -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="updateStudent()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin/students.js"></script>
</body>
</html>
