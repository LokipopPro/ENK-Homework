<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员控制台 - SA学生作业记录管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">SA学生作业记录管理系统</a>
            <button class="navbar-toggler" type="button" onclick="toggleMobileMenu()">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2"></i><span id="username">管理员</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">个人信息</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="javascript:logout()">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span class="nav-text">控制台</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="users.html">
                    <i class="bi bi-people"></i>
                    <span class="nav-text">用户管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="students.html">
                    <i class="bi bi-person-lines-fill"></i>
                    <span class="nav-text">学生管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="homework.html">
                    <i class="bi bi-book"></i>
                    <span class="nav-text">作业管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="statistics.html">
                    <i class="bi bi-bar-chart"></i>
                    <span class="nav-text">统计分析</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="export.html">
                    <i class="bi bi-download"></i>
                    <span class="nav-text">数据导出</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="h3">控制台</h1>
                    <p class="text-muted">系统概览和统计信息</p>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card stat-card bg-primary text-white">
                        <div class="card-body">
                            <div class="stat-value" id="totalStudents">0</div>
                            <div class="stat-label">总学生数</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card bg-success text-white">
                        <div class="card-body">
                            <div class="stat-value" id="totalSA">0</div>
                            <div class="stat-label">SA老师数</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card bg-warning text-white">
                        <div class="card-body">
                            <div class="stat-value" id="totalRecords">0</div>
                            <div class="stat-label">作业记录数</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card bg-danger text-white">
                        <div class="card-body">
                            <div class="stat-value" id="overdueRecords">0</div>
                            <div class="stat-label">逾期记录数</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 图表区域 -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">学生正确率趋势</h5>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="accuracyChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">作业类型分布</h5>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="typeChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 最近作业记录 -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">最近作业记录</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped" id="recentRecordsTable">
                                    <thead>
                                        <tr>
                                            <th onclick="sortTable(this.closest('table'), 0)">学生姓名</th>
                                            <th onclick="sortTable(this.closest('table'), 1)">作业类型</th>
                                            <th onclick="sortTable(this.closest('table'), 2)">周次</th>
                                            <th onclick="sortTable(this.closest('table'), 3)">正确率</th>
                                            <th onclick="sortTable(this.closest('table'), 4)">批改日期</th>
                                            <th onclick="sortTable(this.closest('table'), 5)">状态</th>
                                        </tr>
                                    </thead>
                                    <tbody id="recentRecordsBody">
                                        <!-- 数据将通过JavaScript动态填充 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/admin/dashboard.js"></script>
</body>
</html>
